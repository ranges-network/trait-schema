enums:
  ear_enum:
    description: >-
      An enumeration for body-parts ear lengths are measured from.
    permissible_values:
      "crown":
        description: The top of the head.
        meaning: http://purl.obolibrary.org/obo/UBERON_1000019 # top of head
      "notch":
        description: A surface structure that is the narrowed downward continuation of the conchal space bounded anteriorly by the borders of the tragus, posteriorly by theantitragus, and along its lower lateral margins and inferior boundary by the connection between the first two.
        meaning: http://purl.obolibrary.org/obo/UBERON_0036212 # intertragic incisure

  embryo_enum:
    description: >-
      An enumeration for body-parts embryo lengths are measured from.
    permissible_values:
      "crown":
        description: The top of the head.
        meaning: http://purl.obolibrary.org/obo/UBERON_1000019 # top of head

  hind_foot_enum:
    description: >-
      An enumeration for body-parts hind foot lengths are measured from.
    permissible_values:
      "claw":
        description: A horn-like keratin structure covering the dorsal aspect of the terminal phalanges of fingers and toes.
        meaning: http://purl.obolibrary.org/obo/UBERON_0001705 # nail

  thumb_enum:
    description: >-
      An enumeration for body-parts thumb lengths are measured from.
    permissible_values:
      "claw":
        description: A horn-like keratin structure covering the dorsal aspect of the terminal phalanges of fingers and toes.
        meaning: http://purl.obolibrary.org/obo/UBERON_0001705 # nail
