id: https://w3id.org/FOVT/linkml/traitvalue
name: traitvalue
prefixes:
  linkml: https://w3id.org/linkml/
  traitvalue: http://purl.obolibrary.org/obo/FOVT/data#
  FOVT:  http://purl.obolibrary.org/obo/FOVT_
  OBA:   http://purl.obolibrary.org/obo/OBA_
  GO:   http://purl.obolibrary.org/obo/GO_
  UBERON:   http://purl.obolibrary.org/obo/UBERON_
  PATO:   http://purl.obolibrary.org/obo/PATO_
  dcterms: http://purl.org/dc/terms/
  dwc: http://rs.tdwg.org/dwc/terms/

imports:
  - linkml:types
default_range: string
default_prefix: traitvalue

classes:
  TraitValue:
    slots:
      - occurrenceID
      - institutionCode
      - catalogNumber
      - scientificName
      - order
      - family
      - genus
      - specificEpithet
      - day
      - month
      - year
      - countryCode
      - stateProvince
      - decimalLatitude
      - decimalLongitude
      - dynamicProperties
      - occurrenceRemarks
      - fieldNotes
      - body_mass
      - body_mass_ambiguous
      - body_mass_units_inferred
      - calcar_length
      - crown-rump_length
      - curvilinear_length
      - ear_from_crown
      - ear_from_notch
      - ear_length
      - ear_length_units_inferred
      - embryo_count
      - embryo_count_females
      - embryo_count_males
      - embryo_count_left
      - embryo_count_right
      - embryo_length
      - embryo_size_units_inferred
      - forearm_length
      - hind_foot_length
      - hind_foot_length_units_inferred
      - hind_foot_with_claw
      - hind_foot_without_claw
      - lactation
      - life_stage
      - nipple_state
      - nipple_count
      - nipple_size
      - ovary_description
      - ovary_length
      - ovary_length_2
      - ovary_width
      - ovary_width_2
      - placental_scar_count
      - placental_scar_count_left
      - placental_scar_count_right
      - placental_scars_present
      - pregnancy
      - sex
      - tail_length
      - tail_length_estimated
      - tail_length_units_inferred
      - testis_description
      - testis_length
      - testis_length_2
      - testis_size_units_inferred
      - testis_width
      - testis_width_2
      - testis_position
      - thumb_length
      - thumb_length_with_claw
      - thumb_length_without_claw
      - total_length
      - total_length_ambiguous
      - total_length_estimated
      - total_length_units_inferred
      - tragus_length
      - vagina

slots:
  occurrenceID:
    description: >-
      Identifies the record that contains the trait data values.
    range: string
  institutionCode:
    range: string
  catalogNumber:
    range: string
  scientificName:
    range: string
  order:
    range: string
  family:
    range: string
  genus:
    range: string
  specificEpithet:
    range: string
  day:
    description: >-
      The day of the month that the trait was recorded.
    range: integer
  month:
    description: >-
      The month that the trait was recorded.
    range: integer
  year:
    description: >-
      The year that the trait was recorded.
    range: integer
  countryCode:
    description: >-
      The country where the specimen with the trait was found.
    range: string
  stateProvince:
    description: >-
      The state where the specimen with the trait was found.
    range: string
  decimalLatitude:
    description: >-
      The latitude where the specimen with the trait was found.
    range: float
  decimalLongitude:
    description: >-
      The longitude where the specimen with the trait was found.
    range: float
  dynamicProperties:
    range: string
  occurrenceRemarks:
    range: string
  fieldNotes:
    range: string
  body_mass:
    description: >-
      The mass of specimen having the trait.
    range: float
    related_mappings: 
      - OBA:VT0001259 # body mass
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OBA:VT0001259 # body mass 
  body_mass_ambiguous:
    description: >-
      Specifies if the recorded body mass is ambiguous.
    range: boolean
  body_mass_units_inferred:
    description: >-
      Specifies if the body mass units were inferred. 
    range: boolean
  calcar_length:
    description: >-
      Length of a spur of cartilage arising from inner side of ankle and running along part of outer interfemoral membrane in bats.
    range: float
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:1000000 # calcar length
  crown-rump_length:
    description: >-
      Length from the crown of the head to bottom of the rump of a fetus or embryo, taken in straight line along body axis.
    range: float
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:1000009 # embryonic crown-rump length
  curvilinear_length:
    description: >-
      Length from the crown of the head to bottom of the rump of a fetus or embryo, taken along the spinal curvature.
    range: float
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:1000008 # embryonic curvilinear length
  ear_from_crown:
    description: >-
      The length of a line of an ear from the dorsal end of the base of the ear to the tip of the pinna.
    range: float
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:0000011 # ear length from crown
  ear_from_notch:
    description: >-
      The length of a line of an ear from a helix of the outer ear to an intertragus insicusure of an ear.
    range: float
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:0000005 # ear length to notch
  ear_length:
    description: >-
      The length of an external ear.
    range: float
    related_mappings:
      - OBA:0003426 # external ear length
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OBA:0003426 # external ear length
  ear_length_units_inferred:
    description: >-
      Specifies if the ear length units were inferred. 
    range: boolean
  embryo_count:
    description: >-
      The number of embryos observed in uterus.
    range: integer
    related_mappings:
      - UBERON:0000995 # uterus
      - UBERON:0009098 # gravid uterus
      - UBERON:0000474 # female reproductive system
      - UBERON:0000990 # reproductive system
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf  FOVT:1000002 # uterine embryo count
  embryo_count_females:
    description: >-
      The number of embryos that are female. 
    range: integer
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf  FOVT:1000016 # female uterine embryo count
  embryo_count_males:
    description: >-
      The number of embryos that are male.
    range: integer
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf  FOVT:1000017 # male uterine embryo count
  embryo_count_left:
    description: >-
      The number of embryos observed in left horn of uterus.
    range: integer
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf  FOVT:1000003 # left uterine embryo count
  embryo_count_right:
    description: >-
      The number of embryos observed in right horn of uterus.
    range: integer
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf  FOVT:1000004 # right uterine embryo count
  embryo_length:
    description: >-
      The length of an embryo.
    range: float
    related_mappings:
      - UBERON:0000922 # embryo
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:1000010 # embryonic body length
  embryo_size_units_inferred:
    description: >-
      Specifies if the embryo size units were inferred. 
    range: boolean
  forearm_length:
    description: >-
      The length of a forearm.
    range: float
    related_mappings:
      - FOVT:0001379 # forearm length
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:0001379 # forearm length
  hind_foot_length:
    description: >-
      The lengh of a hindfoot.
    range: float
    related_mappings:
      - OBA:1000049 # pes length
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OBA:1000049 # pes length
  hind_foot_length_units_inferred:
    description: >-
      Specifies if the hind foot length units were inferred. 
    range: boolean
  hind_foot_with_claw:
    description: >-
      A length measurement of a hindfoot that includes the nail.
    range: float
    related_mappings:
      - FOVT:0000003 # pes length with nail
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:0000003 # pes length with nail
  hind_foot_without_claw:
    description: >-
      Length of hindfoot from the back of the ankle to the base of the longest claw.
    range: float
    related_mappings:
      - FOVT:0000004 # pes length without nail
  lactation:
    description: >-
      Secretion or expression of milk from the mammary glands.
    range: string
    related_mappings:
      - UBERON:0001911 # mammary gland
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf GO:0007595 # lactation
  life_stage:
    description: >-
      The age class or life stage of the dwc:Organism(s) at the time the dwc:Occurrence was recorded.
    range: string
    related_mappings:
      - dwc:lifeStage
      - UBERON:0000105 # life cycle stage
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf UBERON:0000105 # life cycle stage
  # mammary_count:
  #   description: >-
  #     The number of mammary glands present in the specimen.
  #   range: integer
  #   related_mappings:
  #     - UBERON:0001911 # mammary gland
  nipple_state:
    description: >-
      The morphology of the specimen's nipple(s).
    range: string
    related_mappings:
      - OBA:VT0006078 # nipple morphology trait
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OBA:VT0006078 # nipple morphology trait
  nipple_count:
    description: >-
      The number of nipples the specimen has.
    range: integer
    related_mappings:
      - OBA:VT1000206 # nipple quantity
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OBA:VT1000206 # nipple quantity
  nipple_size:
    description: >-
      degree of lactational enlargement of the female nipple
    range: float
    related_mappings:
      - OBA:0002334 # nipple size
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OBA:0002334 # nipple size
  ovary_description:
    description: >-
      Description of the morphology of a ovary.
    range: string
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OBA:VT0001126 # ovary morphology trait
  ovary_length:
    description: >-
      The length of the long axis of ovary.
    range: float
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:0001062 # ovary length
  ovary_length_2:
    description: >-
      The length of the long axis of ovary.
    range: float
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:0001062 # ovary length
  ovary_width:
    description: >-
      The length of the short axis of ovary (perpendicular to long axis at midpoint).
    range: float
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:0001371 # ovary width
  ovary_width_2:
    description: >-
      The length of the short axis of ovary (perpendicular to long axis at midpoint).
    range: float
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:0001371 # ovary width
  placental_scar_count:
    description: >-
      Number of placental scars observed in uterus.
    range: integer
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:1000019 # placental scar count
  placental_scar_count_left:
    description: >-
      Number of placental scars observed in left horn of uterus.
    range: integer
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:1000020 # left placental scar count
  placental_scar_count_right:
    description: >-
      Number of placental scars observed in right horn of uterus.
    range: integer
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:1000021 # right placental scar count
  placental_scars_present:
    description: >-
      Presence of sites of former embryo implantation in uterus, appearing as pigmented areas.
    range: boolean
  pregnancy:
    description: >-
      The specimen's uterus contains a developing embryo, fetus, or unborn offspring.
    range: string
    related_mappings:
      - UBERON:0000995 # uterus
      - GO:0007565 # pregnancy
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf GO:0007565 # female pregnancy
  sex:
    description: >-
      The biological sex of the specimen.
    range: string
    related_mappings:
      - PATO:0000047 # biological sex
  tail_length:
    description: >-
      The length of the specimen's tail.
    range: float
    related_mappings:
      - OBA:VT0002758 # tail length
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OBA:VT0002758 # tail length
  tail_length_estimated:
    description: >-
      Specifies if the tail length was estimated.
    range: boolean
  tail_length_units_inferred:
    description: >-
      Specifies if the tail length units were inferred. 
    range: boolean
  testis_description:
    description: >-
      Description of the morphology of a testis.
    range: string
    related_mappings:
      - OBA:VT0001146 # testes morphology trait
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OBA:VT0001146 # testes morphology trait
  testis_length:
    description: >-
      The length of the long axis of testis spheroid.
    range: float
    related_mappings:
      - FOVT:0001057 # testis length
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:0001057 # testis length
  testis_length_2:
    description: >-
      The length of the long axis of testis spheroid.
    range: float
    related_mappings:
      - FOVT:0001057 # testis length
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:0001057 # testis length
  testis_size_units_inferred:
    description: >-
      Specifies if the testis size units were inferred. 
    range: boolean
  testis_width:
    description: >-
      The length of the short axis of testis spheroid (perpendicular to long axis at midpoint).
    range: float
    related_mappings:
      - FOVT:0001368 # testis width
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:0001368 # testis width
  testis_width_2:
    description: >-
      The length of the short axis of testis spheroid (perpendicular to long axis at midpoint).
    range: float
    related_mappings:
      - FOVT:0001368 # testis width
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:0001368 # testis width
  testis_position:
    description: >-
      Degree of descent of the male gonad.
    range: string
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OBA:1000107 # testis position
  thumb_length:
    description: >-
      Length of first digit of forelimb (pollex) from the base to the tip of the longest claw.
    range: float
    related_mappings:
      - OBA_0003003 # manual digit 1 length
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OBA_0003003 # manual digit 1 length
  thumb_length_with_claw:
    description: >-
      The length of a thumb that includes the nail.
    range: float
    related_mappings:
      - FOVT:1000022 # thumb length with nail
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:1000022 # thumb length with nail
  thumb_length_without_claw:
    description: >-
      The length of a thumb that excludes the nail.
    range: float
    related_mappings:
      - FOVT:1000023 # thumb length without nail
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:1000023 # thumb length without nail
  total_length:
    description: >-
      Total length of the specimen. Fish:Total length (TL) is the length of a fish measured from the tip of the snout to tip of the longest lobe of caudal fin. Measurement done with caudal fin lobes compressed and measured at midline.
    range: float
    related_mappings: 
      - OBA:VT0001256 # body length
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OBA:VT0001256 # body length
  total_length_ambiguous:
    description: >-
      Specifies if the total length recorded is ambiguous.
    range: boolean
  total_length_estimated:
    description: >-
      Specifies if the total length was estimated.
    range: boolean
  total_length_units_inferred:
    description: >-
      Specifies if the total length units were inferred. 
    range: boolean
  tragus_length:
    description: >-
      The length of the specimen's tragus.
    range: float
    related_mappings:
      - UBERON:0010887 # tragus
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:1000001 # tragus length
  vaginal perforation:
    description: >-
      The degree of perforation of the female vagina.
    range: string
    related_mappings:
      - OBA:VT0001139
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:1000012 # vaginal perforation