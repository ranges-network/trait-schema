id: https://w3id.org/FOVT/linkml/traitvalue
name: traitvalue
prefixes:
  linkml: https://w3id.org/linkml/
  traitvalue: http://purl.obolibrary.org/obo/FOVT/data#
  FOVT:  http://purl.obolibrary.org/obo/FOVT_
  OBA:   http://purl.obolibrary.org/obo/OBA_
  GO:   http://purl.obolibrary.org/obo/GO_
  UBERON:   http://purl.obolibrary.org/obo/UBERON_
  PATO:   http://purl.obolibrary.org/obo/PATO_
  dcterms: http://purl.org/dc/terms/
  dwc: http://rs.tdwg.org/dwc/terms/

imports:
  - linkml:types
default_range: string
default_prefix: traitvalue

classes:
  TraitValue:
    slots:
      - occurrenceID
      - institutionCode
      - catalogNumber
      - scientificName
      - order
      - family
      - genus
      - specificEpithet
      - day
      - month
      - year
      - countryCode
      - stateProvince
      - decimalLatitude
      - decimalLongitude
      - dynamicProperties
      - occurrenceRemarks
      - fieldNotes
      - age
      - age_class
      - body_mass
      - body_mass_ambiguous
      - body_mass_units_inferred
      - calcar_length
      - colors
      - crown-rump_length
      - curvilinear_length
      - ear_from_crown
      - ear_from_notch
      - ear_length
      - ear_length_units_inferred
      - ear_length_measured_from
      - embryo_count
      - embryo_count_1
      - embryo_count_1_side
      - embryo_count_2
      - embryo_count_2_side
      - embryo_count_females
      - embryo_count_males
      - embryo_count_left
      - embryo_count_right
      - embryo_length
      - embryo_length_measured_from
      - embryo_size_units_inferred
      - forearm_length
      - hind_foot_length
      - hind_foot_length_units_inferred
      - hind_foot_length_includes
      - hind_foot_with_claw
      - hind_foot_without_claw
      - lactation
      - lactation_description
      - life_stage
      - molt_condition
      - nipple_description
      - nipple_count
      - nipple_size
      - numeric_age
      - ovary_description
      - ovary_length_1
      - ovary_length_1_side
      - ovary_length_2
      - ovary_length_2_side
      - ovary_width_1
      - ovary_width_1_side
      - ovary_width_2
      - ovary_width_2_side
      - parity
      - placental_scar_count
      - placental_scar_count_1
      - placental_scar_count_1_side
      - placental_scar_count_2
      - placental_scar_count_2_side
      - placental_scar_count_left
      - placental_scar_count_right
      - placental_scars_present
      - pregnancy
      - reproductive_data
      - sex
      - tail_length
      - tail_length_estimated
      - tail_length_units_inferred
      - testis_description
      - testis_length_1
      - testis_length_1_side
      - testis_length_2
      - testis_length_2_side
      - testis_size_units_inferred
      - testis_width_1
      - testis_width_1_side
      - testis_width_2
      - testis_width_2_side
      - testis_position
      - thumb_length
      - thumb_length_includes
      - thumb_length_with_claw
      - thumb_length_without_claw
      - total_length
      - total_length_ambiguous
      - total_length_estimated
      - total_length_units_inferred
      - tragus_length
      - vaginal_perforation

slots:
  occurrenceID:
    description: >-
      Identifies the record that contains the trait data values.
    range: string
  institutionCode:
    range: string
  catalogNumber:
    range: string
  scientificName:
    range: string
  order:
    range: string
  family:
    range: string
  genus:
    range: string
  specificEpithet:
    range: string
  day:
    description: >-
      The day of the month that the trait was recorded.
    range: integer
  month:
    description: >-
      The month that the trait was recorded.
    range: integer
  year:
    description: >-
      The year that the trait was recorded.
    range: integer
  countryCode:
    description: >-
      The country where the specimen with the trait was found.
    range: string
  stateProvince:
    description: >-
      The state where the specimen with the trait was found.
    range: string
  decimalLatitude:
    description: >-
      The latitude where the specimen with the trait was found.
    range: float
  decimalLongitude:
    description: >-
      The longitude where the specimen with the trait was found.
    range: float
  dynamicProperties:
    range: string
  occurrenceRemarks:
    range: string
  fieldNotes:
    range: string
  age:
    description: >-
      A general description of the age. See also age class and numeric age.
    range: string
    related_mappings:
      - PATO:0000011 # age
      - PATO:0001486 # chronological age
  age_class:
    description: >-
      The age class, reproductive stage, life stage of the biological individual (e.g., juvenile, adult, eft, nymph, etc.).         
    range: string
    related_mappings:
      - UBERON:0000105 # life cycle stage
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf UBERON:0000105 # life cycle stage
  body_mass:
    description: >-
      The mass of specimen having the trait.
    range: float
    related_mappings: 
      - OBA:VT0001259 # body mass
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OBA:VT0001259 # body mass 
  body_mass_ambiguous:
    description: >-
      Specifies if the recorded body mass is ambiguous.
    range: boolean
    related_mappings:
      - OBA:VT0001259 # body mass
  body_mass_units_inferred:
    description: >-
      Specifies if the body mass units were inferred. 
    range: boolean
    related_mappings:
      - OBA:VT0001259 # body mass
  calcar_length:
    description: >-
      Length of a spur of cartilage arising from inner side of ankle and running along part of outer interfemoral membrane in bats.
    range: float
    related_mappings:
      - FOVT:1000000 # calcar length
      - UBERON:0010869 # calcar
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:1000000 # calcar length
  colors:
    description: >-
      A description of colors.
    range: string
    related_mappings:
      - PATO:0000014 # color
  crown-rump_length:
    description: >-
      Length from the crown of the head to bottom of the rump of a fetus or embryo, taken in straight line along body axis.
    range: float
    related_mappings:
      - FOVT:1000009 # embryonic crown-rump length
      - OBA:VT0001256 # body length
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:1000009 # embryonic crown-rump length
  curvilinear_length:
    description: >-
      Length from the crown of the head to bottom of the rump of a fetus or embryo, taken along the spinal curvature.
    range: float
    related_mappings:
      - FOVT:1000008 # embryonic curvilinear length
      - OBA:VT0001256 # body length
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:1000008 # embryonic curvilinear length
  ear_from_crown:
    description: >-
      The length of a line of an ear from the dorsal end of the base of the ear to the tip of the pinna.
    range: float
    related_mappings:
      - FOVT:0000011 # ear length from crown
      - UBERON:0001690 # ear
      - OBA:0003426 # external ear length
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:0000011 # ear length from crown
  ear_from_notch:
    description: >-
      The length of a line of an ear from a helix of the outer ear to an intertragus insicusure of an ear.
    range: float
    related_mappings:
      - FOVT:0000005 # ear length to notch
      - UBERON:0001690 # ear
      - OBA:0003426 # external ear length
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:0000005 # ear length to notch
  ear_length:
    description: >-
      The length of an external ear.
    range: float
    related_mappings:
      - OBA:0003426 # external ear length
      - FOVT:0000005 # ear length to notch
      - FOVT:0000011 # ear length from crown
      - UBERON:0001690 # ear
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OBA:0003426 # external ear length
  ear_length_units_inferred:
    description: >-
      Specifies if the ear length units were inferred. 
    range: boolean
    related_mappings:
      - OBA:0003426 # external ear length
      - FOVT:0000005 # ear length to notch
      - FOVT:0000011 # ear length from crown
      - UBERON:0001690 # ear
  ear_length_measured_from:
    description: >-
      The position of the external ear from which the length was measured (typically from either the crown of head or the notch of ear to the tip of ear).
    range: ear_enum
    related_mappings:
      - OBA:0003426 # external ear length
      - FOVT:0000005 # ear length to notch
      - FOVT:0000011 # ear length from crown
      - UBERON:0001690 # ear
  embryo_count:
    description: >-
      The number of embryos observed in uterus.
    range: integer
    related_mappings:
      - UBERON:0000995 # uterus
      - UBERON:0009098 # gravid uterus
      - UBERON:0000474 # female reproductive system
      - UBERON:0000990 # reproductive system
      - UBERON:0000922 # embryo
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf  FOVT:1000002 # uterine embryo count
  embryo_count_1:
    description: >-
      The number of embryos observed in one horn of the uterus.
    range: integer
    related_mappings:
      - UBERON:0000995 # uterus
      - UBERON:0009098 # gravid uterus
      - UBERON:0000474 # female reproductive system
      - UBERON:0000990 # reproductive system
      - UBERON:0000922 # embryo
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf  FOVT:1000002 # uterine embryo count
  embryo_count_1_side:
    description: >-
      The side of the uterus (left or right) in which the embryo count was observed.
    range: string
    related_mappings:
      - UBERON:0000995 # uterus
      - UBERON:0009098 # gravid uterus
      - UBERON:0000474 # female reproductive system
      - UBERON:0000990 # reproductive system
      - UBERON:0000922 # embryo
  embryo_count_2:
    description: >-
      The number of embryos observed in one horn of the uterus.
    range: integer
    related_mappings:
      - UBERON:0000995 # uterus
      - UBERON:0009098 # gravid uterus
      - UBERON:0000474 # female reproductive system
      - UBERON:0000990 # reproductive system
      - UBERON:0000922 # embryo
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf  FOVT:1000002 # uterine embryo count
  embryo_count_2_side:
    description: >-
      The side of the uterus (left or right) in which the embryo count was observed.
    range: string
    related_mappings:
      - UBERON:0000995 # uterus
      - UBERON:0009098 # gravid uterus
      - UBERON:0000474 # female reproductive system
      - UBERON:0000990 # reproductive system
      - UBERON:0000922 # embryo
  embryo_count_females:
    description: >-
      The number of embryos that are female. 
    range: integer
    related_mappings:
      - UBERON:0000995 # uterus
      - UBERON:0009098 # gravid uterus
      - UBERON:0000474 # female reproductive system
      - UBERON:0000990 # reproductive system
      - UBERON:0000922 # embryo
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf  FOVT:1000016 # female uterine embryo count
  embryo_count_males:
    description: >-
      The number of embryos that are male.
    range: integer
    related_mappings:
      - UBERON:0000995 # uterus
      - UBERON:0009098 # gravid uterus
      - UBERON:0000474 # female reproductive system
      - UBERON:0000990 # reproductive system
      - UBERON:0000922 # embryo
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf  FOVT:1000017 # male uterine embryo count
  embryo_count_left:
    description: >-
      The number of embryos observed in left horn of uterus.
    range: integer
    related_mappings:
      - UBERON:0000995 # uterus
      - UBERON:0009098 # gravid uterus
      - UBERON:0000474 # female reproductive system
      - UBERON:0000990 # reproductive system
      - UBERON:0000922 # embryo
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf  FOVT:1000003 # left uterine embryo count
  embryo_count_right:
    description: >-
      The number of embryos observed in right horn of uterus.
    range: integer
    related_mappings:
      - UBERON:0000995 # uterus
      - UBERON:0009098 # gravid uterus
      - UBERON:0000474 # female reproductive system
      - UBERON:0000990 # reproductive system
      - UBERON:0000922 # embryo
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf  FOVT:1000004 # right uterine embryo count
  embryo_length:
    description: >-
      The length of an embryo, taken in a a straight line along the body axis.
    range: float
    related_mappings:
      - UBERON:0000922 # embryo
      - FOVT:1000010 # embryonic body length
      - FOVT:1000008 # embryonic curvilinear length
      - FOVT:1000009 # embryonic crown-rump length
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:1000010 # embryonic body length
  embryo_length_measured_from:
    description: >-
      Positions of embryo from which length was measured (crown of head to rump of fetus).
    range: embryo_enum
    related_mappings:
      - UBERON:0000922 # embryo
      - FOVT:1000010 # embryonic body length
      - FOVT:1000008 # embryonic curvilinear length
      - FOVT:1000009 # embryonic crown-rump length
  embryo_size_units_inferred:
    description: >-
      Specifies if the embryo size units were inferred. 
    range: boolean
    related_mappings:
      - UBERON:0000922 # embryo
      - FOVT:1000010 # embryonic body length
      - FOVT:1000008 # embryonic curvilinear length
      - FOVT:1000009 # embryonic crown-rump length
  forearm_length:
    description: >-
      The length of a forearm.
    range: float
    related_mappings:
      - FOVT:0001379 # forearm length
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:0001379 # forearm length
  hind_foot_length:
    description: >-
      The lengh of a hindfoot.
    range: float
    related_mappings:
      - OBA:1000049 # pes length
      - UBERON:0002387 # pes
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OBA:1000049 # pes length
  hind_foot_length_units_inferred:
    description: >-
      Specifies if the hind foot length units were inferred. 
    range: boolean
    related_mappings:
      - OBA:1000049 # pes length
      - UBERON:0002387 # pes
  hind_foot_length_includes:
    description: >-
      The part(s) included in the hind_foot_length measurement (typically from the back of the ankle to either the base or tip of the longest claw). 
    range: hind_foot_enum
    related_mappings:
      - OBA:1000049 # pes length
      - UBERON:0002387 # pes
  hind_foot_with_claw:
    description: >-
      A length measurement of a hindfoot that includes the nail.
    range: float
    related_mappings:
      - FOVT:0000003 # pes length with nail
      - OBA:1000049 # pes length
      - UBERON:0002387 # pes
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:0000003 # pes length with nail
  hind_foot_without_claw:
    description: >-
      Length of hindfoot from the back of the ankle to the base of the longest claw.
    range: float
    related_mappings:
      - FOVT:0000004 # pes length without nail
      - OBA:1000049 # pes length
      - UBERON:0002387 # pes
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:0000004 # pes length without nail
  lactation:
    description: >-
      Secretion or expression of milk from the mammary glands.
    range: string
    related_mappings:
      - UBERON:0001911 # mammary gland
      - GO:0007595 # lactation
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf GO:0007595 # lactation
  lactation_description:
    description: >-
       A description of the secretion or expression of milk from the mammary glands.
    range: string
    related_mappings:
      - UBERON:0001911 # mammary gland
      - GO:0007595 # lactation
  life_stage:
    description: >-
      The age class or life stage of the dwc:Organism(s) at the time the dwc:Occurrence was recorded.
    range: string
    related_mappings:
      - dwc:lifeStage
      - UBERON:0000105 # life cycle stage
      - PATO:0000011 # age
      - PATO:0001486 # chronological age
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf UBERON:0000105 # life cycle stage
  # mammary_count:
  #   description: >-
  #     The number of mammary glands present in the specimen.
  #   range: integer
  #   related_mappings:
  #     - UBERON:0001911 # mammary gland
  molt_condition:
    description: >-
      A description of molt stage or condition.
    range: string
    related_mappings:
      - GO:0044851 # hair cycle phase
      - GO:0042303 # molting cycle
      - GO:0022404 # molting cycle process
  nipple_description:
    description: >-
      The state or condition of the nipple(s).  
    range: string
    related_mappings:
      - UBERON:0001911 # mammary gland
      - OBA:VT0006078 # nipple morphology trait
      - OBA:0002334 # nipple size
      - OBA:VT0100028 # nipple diameter
      - OBA:VT1000205 # nipple length
      - OBA:0002336 # nipple position
      - OBA:VT1000206 # nipple quantity
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OBA:VT0006078 # nipple morphology trait
  nipple_count:
    description: >-
      The number of nipples the specimen has.
    range: integer
    related_mappings:
      - OBA:VT1000206 # nipple quantity
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OBA:VT1000206 # nipple quantity
  nipple_size:
    description: >-
      degree of lactational enlargement of the female nipple
    range: string
    related_mappings:
      - OBA:0002334 # nipple size
      - OBA:VT0006078 # nipple morphology trait
      - OBA:VT0100028 # nipple diameter
      - OBA:VT1000205 # nipple length
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OBA:0002334 # nipple size
  numeric_age:
    description: >-
      The age of specimen given as a numeric value plus units.
    range: string
    related_mappings:
      - PATO:0001486 # chronological age
      - PATO:0000011 # age
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf PATO:0001486 # chronological age
  ovary_description:
    description: >-
      Description of the condition of the ovary observed.
    range: string
    related_mappings:
      - OBA:VT0001126 # ovary morphology trait
      - UBERON:0000995 # uterus
      - UBERON:0000474 # female reproductive system
      - UBERON:0000990 # reproductive system
      - FOVT:0001062 # ovary length
      - FOVT:0001371 # ovary width
      - UBERON:0000992 # ovary
      - OBA:VT0010375 # ovary diameter
      - OBA:VT1000641 # ovary mass
      - OBA:1000545 # ovary quality
      - OBA:VT0001127 # ovary size trait
      - FOVT:0001064 # left ovary length
      - FOVT:0001063 # right ovary length
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OBA:VT0001126 # ovary morphology trait
  ovary_length_1:
    description: >-
      The length of an ovary.
    range: float
    related_mappings:
      - FOVT:0001062 # ovary length
      - UBERON:0000992 # ovary
      - FOVT:0001064 # left ovary length
      - FOVT:0001063 # right ovary length
      - OBA:VT0001126 # ovary morphology trait
      - OBA:VT0001127 # ovary size trait
      - OBA:1000545 # ovary quality
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:0001062 # ovary length
  ovary_length_1_side:
    description: >-
      The side of location of the ovary.
    range: string
    related_mappings:
      - UBERON:0000992 # ovary
      - OBA:VT0001126 # ovary morphology trait
      - FOVT:0001062 # ovary length
      - FOVT:0001064 # left ovary length
      - FOVT:0001063 # right ovary length
  ovary_length_2:
    description: >-
      The length of an ovary.
    range: float
    related_mappings:
      - FOVT:0001062 # ovary length
      - UBERON:0000992 # ovary
      - FOVT:0001064 # left ovary length
      - FOVT:0001063 # right ovary length
      - OBA:VT0001126 # ovary morphology trait
      - OBA:VT0001127 # ovary size trait
      - OBA:1000545 # ovary quality
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:0001062 # ovary length
  ovary_length_2_side:
    description: >-
      The side of location of the ovary.
    range: string
    related_mappings:
      - UBERON:0000992 # ovary
      - OBA:VT0001126 # ovary morphology trait
      - FOVT:0001062 # ovary length
      - FOVT:0001064 # left ovary length
      - FOVT:0001063 # right ovary length
  ovary_width_1:
    description: >-
      The width of an ovary.
    range: float
    related_mappings:
      - FOVT:0001371 # ovary width
      - UBERON:0000992 # ovary
      - OBA:VT0001126 # ovary morphology trait
      - OBA:VT0001127 # ovary size trait
      - OBA:1000545 # ovary quality
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:0001371 # ovary width
  ovary_width_1_side:
    description: >-
      The side of location of the ovary.
    range: string
    related_mappings:
      - UBERON:0000992 # ovary
      - OBA:VT0001126 # ovary morphology trait
      - FOVT:0001371 # ovary width
  ovary_width_2:
    description: >-
      The width of the short axis of ovary (perpendicular to long axis at midpoint).
    range: float
    related_mappings:
      - FOVT:0001371 # ovary width
      - UBERON:0000992 # ovary
      - OBA:VT0001126 # ovary morphology trait
      - OBA:VT0001127 # ovary size trait
      - OBA:1000545 # ovary quality
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:0001371 # ovary width
  ovary_width_2_side:
    description: >-
      The side of location of the ovary.
    range: string
    related_mappings:
      - UBERON:0000992 # ovary
      - OBA:VT0001126 # ovary morphology trait
      - FOVT:0001371 # ovary width
  parity:
    description: >-
      The number of times that a viviparous organism has given birth.
    range: integer
    related_mappings:
      - PATO:0002370 # parity
      - GO:0007565 # female pregnancy
      - OBI:0002394 # number of pregnancies
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf PATO:0002370 # parity
  placental_scar_count:
    description: >-
      Number of placental scars observed in uterus.
    range: integer
    related_mappings:
      - FOVT:1000019 # placental scar count
      - FOVT:1000018 # placental scar
      - UBERON:0000995 # uterus
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:1000019 # placental scar count
  placental_scar_count_1:
    description: >-
      Number of placental scars observed in one horn of uterus.
    range: integer
    related_mappings:
      - FOVT:1000019 # placental scar count
      - FOVT:1000018 # placental scar
      - UBERON:0000995 # uterus
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:1000019 # placental scar count
  placental_scar_count_1_side:
    description: >-
      The side of the uterus on which placental scars are observed (left, right).
    range: string
    related_mappings:
      - FOVT:1000019 # placental scar count
      - FOVT:1000018 # placental scar
      - UBERON:0000995 # uterus
  placental_scar_count_2:
    description: >-
      Number of placental scars observed in one horn of uterus.
    range: integer
    related_mappings:
      - FOVT:1000019 # placental scar count
      - FOVT:1000018 # placental scar
      - UBERON:0000995 # uterus
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf FOVT:1000019 # placental scar count
  placental_scar_count_2_side:
    description: >-
      The side of the uterus on which placental scars are observed (left, right).
    range: string
