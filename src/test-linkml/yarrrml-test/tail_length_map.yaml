prefixes:
  ex: http://www.example.com/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  OBA:   http://purl.obolibrary.org/obo/OBA_
  OBI:   http://purl.obolibrary.org/obo/OBI_
  RO:   http://purl.obolibrary.org/obo/RO_

mappings:
  specimen:
    sources:
      - ['ASUoccurrence-reduced-100.csv~csv']
    s: ex:specimen_$(occurrenceID)
    po:
      - [rdf:type, OBI:0100051~iri] # specimen
  tail_length:
    sources:
      - ['ASUoccurrence-reduced-100.csv~csv']
    s: ex:tail_length_$(occurrenceID)
    po:
      - [rdf:type, OBA:VT0002758~iri]
      - [RO:0000052, ex:specimen_$(occurrenceID)~iri] # tail length inheres in specimen